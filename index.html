<!doctype html>
<html lang="zh-CN">
  <head>
<meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://*:*; img-src 'self' data:; frame-ancestors 'none';">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1cb0f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="kye-test" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>kye-test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body>
  <div id="root"></div>
  <div id="boot-error" style="display:none;position:fixed;inset:0;background:#fff;z-index:999999;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px;">
    <div style="font-size:20px;font-weight:700;">页面加载异常</div>
    <pre id="boot-error-text" style="white-space:pre-wrap;color:#e63946;max-width:100%;overflow:auto;">正在加载...</pre>
    <button id="boot-reload" style="padding:10px 24px;border:none;border-radius:8px;background:#3370ff;color:#fff;font-size:14px;cursor:pointer;">重新加载</button>
  </div>
  <script>
    (function () {
      var lastError = '';
      function showBootError() {
        var el = document.getElementById('boot-error');
        if (!el || el.style.display === 'flex') return;
        var pre = document.getElementById('boot-error-text');
        if (pre && lastError) pre.textContent = lastError;
        el.style.display = 'flex';
      }
      window.addEventListener('error', function (e) {
        lastError = (e && e.message) || '未知脚本错误';
        showBootError();
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        lastError = (r && (r.message || String(r))) || '未知异步错误';
      });
      document.getElementById('boot-reload').addEventListener('click', function () {
        location.reload();
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          if (!lastError) lastError = '脚本未完成加载（可能网络超时）';
          showBootError();
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
